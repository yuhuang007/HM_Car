    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L7 3.5L0 7Z" fill="#53686e"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="351" rx="7" fill="#f4f8f7" stroke="#b6cbc8"/>
  <text x="29" y="42" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#294e50">SIGNAL MAP</text>
  <path d="M29 57h942" stroke="#b6cbc8"/>
  <g fill="none" stroke="#53686e" stroke-width="2" marker-end="url(#arr)">
    <path d="M179 127h106" marker-start="url(#arr)"/>
    <path d="M469 127h126" marker-start="url(#arr)"/>
    <path d="M788 127h43" marker-start="url(#arr)"/>
    <path d="M653 166v44H541v43"/>
    <path d="M692 253v-87"/>
    <path d="M894 253v-43H730v-44" marker-start="url(#arr)"/>
  </g>
  <g stroke-width="1.5">
    <rect x="30" y="88" width="149" height="78" rx="6" fill="#fff" stroke="#b6cbc8"/>
    <rect x="285" y="88" width="184" height="78" rx="6" fill="#dff2ec" stroke="#50a08e"/>
    <rect x="595" y="88" width="193" height="78" rx="6" fill="#deedf5" stroke="#639ab9"/>
    <rect x="831" y="88" width="139" height="78" rx="6" fill="#fff0d4" stroke="#d9ac60"/>
    <rect x="468" y="253" width="146" height="70" rx="6" fill="#fff" stroke="#b6cbc8"/>
    <rect x="620" y="253" width="144" height="70" rx="6" fill="#fff" stroke="#b6cbc8"/>
    <rect x="817" y="253" width="154" height="70" rx="6" fill="#fff" stroke="#b6cbc8"/>
  </g>
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle" fill="#193438">
    <g font-size="19" font-weight="bold">
      <text x="104" y="121">LAN Client</text><text x="377" y="121">Hi3861</text>
      <text x="691" y="121">STM32G030</text><text x="901" y="121">CS100A</text>
      <text x="541" y="282">Motors</text><text x="692" y="282">Encoders</text><text x="894" y="282">INA219</text>
    </g>
    <g font-size="14" fill="#3d5a5c">
      <text x="104" y="146">Commands / Status</text><text x="377" y="146">OpenHarmony / OLED</text>
      <text x="691" y="146">Control loop / PID</text><text x="901" y="146">Range / Line</text>
      <text x="541" y="305">Dual PWM</text><text x="692" y="305">Wheel speed</text><text x="894" y="305">I&#178;C voltage</text>
    </g>
    <g font-size="13" font-weight="600" fill="#344f55">
      <text x="232" y="111">Wi-Fi / UDP</text><text x="532" y="111">UART / 115200</text>
      <text x="810" y="187">UART / 9600</text>
