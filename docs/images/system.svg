<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="353" viewBox="0 0 1000 353" role="img" aria-labelledby="title desc">
  <title id="title">HM Car communication and feedback topology</title>
  <desc id="desc">Wi-Fi and UDP link a client to Hi3861. Hi3861 and STM32G030 communicate over UART at 115200. STM32 connects to CS100A over UART at 9600, drives the two motors, reads encoders and measures voltage using INA219.</desc>
